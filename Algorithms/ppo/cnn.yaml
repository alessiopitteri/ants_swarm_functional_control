actor:
  type: cnn  # 'mlp' or 'cnn'
  cnn_layers:  # Layers for processing state input
    - filters: 256
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: false
  dense_layers: 
    - units: 128
      activation: relu
      use_batchnorm: false
  output:
    activation: sigmoid
    kernel_initializer: [-3, -2]  # Random uniform initialization
    bias_initializer: -1
    scale_with_action_bound: false

critic:
  type: cnn  # 'mlp' or 'cnn'
  cnn_layers:  # Layers for processing state input
    - filters: 256
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: false
  action_layers:  # Layers for processing action input
    - units: 128
      activation: relu
      use_batchnorm: false
  dense_layers:  # Shared layers after concatenation of state and action
    - units: 128
      activation: relu
      use_batchnorm: false
  output:  # Output layer configuration
    activation: linear  # Default for critic's output