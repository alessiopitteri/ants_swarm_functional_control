# Prototype file (MLP) actor and critic.
actor:
  type: mlp
  layers:
    - units: 256
      activation: relu
      use_batchnorm: false
    - units: 256
      activation: relu
      use_batchnorm: false
  dense_layers:
    - units: 128
      activation: relu
  output:
    activation: sigmoid
    kernel_initializer: [-3, -2]  # Random uniform initialization
    bias_initializer: -1
    scale_with_action_bound: true

critic:
  type: mlp
  layers:
    - units: 256
      activation: relu
      use_batchnorm: false
    - units: 256
      activation: relu
      use_batchnorm: false
  dense_layers:
    - units: 128
      activation: relu
  output:
    activation: linear
