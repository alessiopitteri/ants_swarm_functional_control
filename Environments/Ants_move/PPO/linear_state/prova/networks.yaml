actor:
  type: mlp  # 'mlp' or 'cnn'
  layers:  # Layers for processing state input
    - units: 256
      activation: relu
      use_batchnorm: true
      dropout: 0.0
    - units: 128
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  
  dense_layers: 
    - units: 64
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  output:
    activation: linear
    kernel_initializer: false  # Random uniform initialization
    bias_initializer: false
    scale_with_action_bound: false

critic:
  type: mlp  # 'mlp' or 'cnn'
  layers:  # Layers for processing state input
    - units: 256
      activation: relu
      use_batchnorm: true
      dropout: 0.0
    - units: 128
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  
  dense_layers: 
    - units: 64
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  output:  # Output layer configuration
    activation: linear  # Default for critic's output