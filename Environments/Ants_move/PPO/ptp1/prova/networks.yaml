actor:
  type: cnn  # 'mlp' or 'cnn'
  cnn_layers:  # Layers for processing state input
    - filters: 64
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: true
      dropout: 0.0
    - filters: 32
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  dense_layers: 
    - units: 256
      activation: relu
      use_batchnorm: true
      dropout: 0.0
    - units: 128
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  output:
    activation: linear
    kernel_initializer: false 
    bias_initializer: false
    scale_with_action_bound: false

critic:
  type: cnn  
  cnn_layers:  
    - filters: 64
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: true
      dropout: 0.0
    - filters: 32
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  dense_layers:  
    - units: 256
      activation: relu
      use_batchnorm: true
      dropout: 0.0
    - units: 128
      activation: relu
      use_batchnorm: true
      dropout: 0.0
  output:  
    activation: linear 