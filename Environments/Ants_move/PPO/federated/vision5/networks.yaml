actor:
  type: cnn  # 'mlp' or 'cnn'
  cnn_layers:  # Layers for processing state input
    - filters: 32
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: true
      dropout: 0.1
  dense_layers: 
    - units: 128
      activation: relu
      use_batchnorm: true
      dropout: 0.1
    - units: 64
      activation: relu
      use_batchnorm: true
      dropout: 0.1
  output:
    activation: linear
    kernel_initializer: false  # Random uniform initialization
    bias_initializer: false
    scale_with_action_bound: false

critic:
  type: cnn  # 'mlp' or 'cnn'
  cnn_layers:  # Layers for processing state input
    - filters: 32
      kernel_size: 2
      stride: 1
      activation: relu
      use_batchnorm: true
      dropout: 0.1
  dense_layers:  # Shared layers after concatenation of state and action
    - units: 128
      activation: relu
      use_batchnorm: true
      dropout: 0.1
    - units: 64
      activation: relu
      use_batchnorm: true
      dropout: 0.1
  output:  # Output layer configuration
    activation: linear  # Default for critic's output